name: Daily ASO scan

on:
  schedule:
    - cron: "15 5 * * *"   # her gün 05:15 UTC (08:15 TR)
    - cron: "30 8 * * *"   # yedek: GitHub ilkini geciktirir/atlarsa (o gün tarandıysa atlanır)
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]
    paths: ["site/**", "tracker/build.py", "data/popularity/**"]   # dashboard/popülerlik değişince taramadan yeniden yayınla

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Zamanlanmış çalışma o gün zaten tarandıysa (ör. yedek cron) taramayı atla
      - name: Skip if already scanned today
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/raw/$(date -u +%F)/run.json" ]; then
            echo "Bugün zaten tarandı, atlanıyor."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Collect rankings + metadata
        if: github.event_name != 'push' && steps.guard.outputs.skip != 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python -m tracker.collect

      - name: Build database + dashboard data
        run: python -m tracker.build

      - name: Commit raw data
        if: github.event_name != 'push' && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "aso-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) scan"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
